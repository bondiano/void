### void shop — the whole thing, running.
###
###     docker compose up --build          the shop on http://localhost:8080
###     docker compose --profile obs up    plus prometheus and grafana
###
### Eight services, and every one of them is a claim this example makes
### about void being deployable rather than demonstrable:
###
###   postgres   the data, the queue, the message log and the outbox —
###              one database, because that is what makes an order and
###              the fact that it happened commit together
###   redis      sessions and the shared cache, which is what lets the
###              web tier be more than one process
###   mailpit    an SMTP relay with a web inbox: the receipts, the
###              cancellations and the magic-link letters land in it
###   minio      the bucket the product pictures live in — because a
###              picture uploaded to one replica's disk is a 404 on the
###              next, which is what [:deploy :shape] :fleet refuses to
###              start with
###   createbucket  a one-shot `mc mb` — the bucket is part of this
###              deployment's schema, so it is created the way the
###              tables are
###   migrate    a one-shot `void db migrate` + `void shop seed`
###   web        the storefront and the JSON API
###   worker     the same image, with the worker and the scheduler on
###
### web and worker run **the same image and the same code**; what
### differs is two environment variables. That is the deployment shape
### void/jobs is built for: the process that enqueues is usually not the
### process that runs.

name: void-shop

x-app: &app
  # One image for the three services that are this application. Without
  # it compose gives each service its own tag from the same Dockerfile,
  # which is three builds of the same thing — and a `build web` that
  # leaves the worker on older code.
  image: void-shop
  build:
    context: ../..
    dockerfile: examples/shop/Dockerfile
  environment: &app-env
    VOID_PROFILE: prod
    VOID_SHOP_DB: postgres
    VOID_SHOP_REDIS: "1"
    # config/prod.janet reads these as {:secret "…"} references, so the
    # values live in the environment and the config tree holds an opaque
    # box that does not print. Change them for anything that is not a
    # laptop.
    SHOP_SECRET_KEY: development-signing-key-change-me
    # every connection detail is an env var rather than a line in
    # config/prod.janet, which is what lets one image run against any
    # database (VOID_DB_POSTGRES__URL -> [:db-postgres :url])
    VOID_DB_POSTGRES__URL: postgres://shop:shop@postgres:5432/shop
    # redis is configured by parts rather than by a URL: [:redis :url]
    # is read only for the keys the slice does not already carry, and
    # the plugin's own defaults carry :host and :port, so a URL loses
    # to them ([:db-postgres] has no such defaults, which is why the
    # line above is a URL)
    VOID_REDIS__HOST: redis
    VOID_REDIS__PORT: "6379"
    VOID_REDIS__DATABASE: "0"
    VOID_MAIL__SMTP__HOST: mailpit
    VOID_MAIL__SMTP__PORT: "1025"
    VOID_MAIL__BASE_URL: http://localhost:8080
    # product pictures in the bucket rather than on a container's disk.
    # main.janet reads this one the way it reads VOID_SHOP_DB: it decides
    # which plugins are composed, so a deployment on a disk never loads
    # the signer or the TLS stack
    VOID_SHOP_STORAGE: s3
    # the application reaches minio over the compose network...
    VOID_STORAGE_S3__ENDPOINT: http://minio:9000
    VOID_STORAGE_S3__BUCKET: shop
    VOID_STORAGE_S3__REGION: us-east-1
    # ...and a browser reads the pictures from the host, which is why
    # the public origin is a second key rather than the same one
    VOID_STORAGE_S3__PUBLIC_URL: http://localhost:9000/shop
    # secret references, like SHOP_SECRET_KEY above: the values live in
    # the environment and the config tree holds boxes that do not print
    #
    MINIO_ACCESS_KEY: shop
    MINIO_SECRET_KEY: shop-shop-shop
    # the pictures come from an origin the default policy does not
    # know, and a CSP that blocks an image blocks it silently — so the
    # deployment that adds the origin is the file that adds it to the
    # policy. The value is a janet literal, like the queue list below
    VOID_SECURITY__CSP__POLICY__IMG_SRC: '[:self "data:" "http://localhost:9000"]'
    # /metrics answers this bearer token and nothing else
    VOID_OBS_HTTP__TOKEN: prometheus-scrape-token
    # /openapi.json and the Swagger UI at /docs are a dev-profile thing
    # by default (void/openapi), and this compose file is a demo: they
    # are on so the JSON side of the shop can be read without a
    # checkout. A deployment that is not a demo leaves this out.
    VOID_OPENAPI__ENABLED: "true"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started
    createbucket:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # published so `psql` from the host can look at the outbox and the
      # audit trail while the demo runs — that is the whole reason
      - "55432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      # the inbox: http://localhost:8025 — open a receipt, click a
      # magic-link letter, watch what void/mail-jobs actually sent
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: shop
      MINIO_ROOT_PASSWORD: shop-shop-shop
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - miniodata:/data
    ports:
      # 9000 is the S3 API, and it is published because the *browser*
      # loads the product pictures from it — the application talks to
      # the same server over the compose network under the name minio.
      # 9001 is the console: http://localhost:9001 (shop / shop-shop-shop),
      # where the objects the desk uploaded are visible as objects
      - "9000:9000"
      - "9001:9001"

  # One shot, like `migrate` below and for the same reason: a bucket is
  # part of the schema of this deployment. `mc anonymous set download`
  # is what makes the pictures readable without a signature — the shop
  # serves them straight to a browser, and a private bucket would mean
  # a presigned URL per image per page. A bucket holding receipts would
  # keep the default and let void/storage mint those links instead.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 shop shop-shop-shop &&
      mc mb --ignore-existing local/shop &&
      mc anonymous set download local/shop
      "

  # One shot, and it has to finish before anything serves: the schema is
  # the application's (void/auth-db and void/bus-db ship their DDL as
  # data, and the migration that creates their tables is ours), and the
  # catalog has to exist for the shop to be worth opening. Both commands
  # are idempotent.
  migrate:
    <<: *app
    command: ["sh", "-c", "void --profile prod db migrate && void --profile prod shop seed"]
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *app-env
      # sessions and the rate limiter's counters are in redis, so this
      # can be scaled to more than one replica without a login working
      # every other request
      VOID_HTTP__WORKERS: "1"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # The same image and the same code, with two switches flipped. It
  # serves HTTP too — nothing routes to it, but /health is what this
  # healthcheck reads and /metrics is what prometheus scrapes, and a
  # worker nobody can see the inside of is a worker nobody can debug.
  worker:
    <<: *app
    environment:
      <<: *app-env
      VOID_JOBS__WORKER__ENABLED: "true"
      VOID_JOBS__WORKER__QUEUES: "[:default :payments :mail :maintenance]"
      # the nightly cart sweep (src/modules/cart/cart.jobs.janet).
      # `defschedule` fires once across a fleet, so this stays true even
      # with several workers
      VOID_JOBS__SCHEDULER__ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # -- the observability profile -----------------------------------------
  #
  #     docker compose --profile obs up
  #
  # Both processes are scraped, because both of them do work: the web
  # tier answers requests and the worker charges cards, and the
  # interesting graph in a shop (payments retried, orders unpaid) is
  # the worker's.

  prometheus:
    image: prom/prometheus:latest
    profiles: [obs]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - web
      - worker

  grafana:
    image: grafana/grafana:latest
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
    ports:
      # http://localhost:3000 — the "void shop" dashboard is provisioned
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
