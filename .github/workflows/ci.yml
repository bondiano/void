name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # void/db-postgres, void/db-mysql, void/redis and void/kafka are
    # clients of a real server or they are nothing, and void/cache's and
    # void/jobs's redis backends are too: their integration suites run
    # when VOID_TEST_PG / VOID_TEST_MYSQL / VOID_TEST_REDIS /
    # VOID_TEST_KAFKA / VOID_TEST_S3 name a server, and skip (loudly)
    # when they do not — so CI is where they are a gate.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: void
          POSTGRES_PASSWORD: void
          POSTGRES_DB: void_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: void
          MYSQL_PASSWORD: void
          MYSQL_DATABASE: void_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      kafka:
        # a single KRaft broker; the image's default configuration
        # advertises localhost:9092, which is exactly what a mapped port
        # on the runner needs. A GitHub service cannot override the
        # container command, which is why this is apache/kafka and not
        # an image whose entrypoint wants arguments
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    env:
      VOID_TEST_PG: host=127.0.0.1 port=5432 user=void password=void dbname=void_test
      VOID_TEST_MYSQL: mysql://void:void@127.0.0.1:3306/void_test
      # database 9, and every suite works under a prefix of its own
      VOID_TEST_REDIS: redis://127.0.0.1:6379/9
      # every kafka suite works under a topic prefix of its own too —
      # the broker keeps the log, which is the point and the hazard
      VOID_TEST_KAFKA: 127.0.0.1:9092
      # and the bucket void/storage-s3 signs against; every object it
      # writes carries this process's pid in its key, and the suite
      # takes them away afterwards
      VOID_TEST_S3: http://127.0.0.1:9000
      VOID_TEST_S3_BUCKET: void-test
      VOID_TEST_S3_KEY: void
      VOID_TEST_S3_SECRET: void-void-void

    steps:
      - uses: actions/checkout@v4

      - name: Install Janet
        run: |
          git clone --depth 1 --branch v1.41.2 https://github.com/janet-lang/janet /tmp/janet
          make -C /tmp/janet -j"$(nproc)"
          sudo make -C /tmp/janet install

      - name: Install jpm
        run: |
          git clone --depth 1 https://github.com/janet-lang/jpm /tmp/jpm
          cd /tmp/jpm && sudo janet bootstrap.janet

      - name: Install dependencies
        # the list is the package graph's, not this file's (ADR-0020):
        # spork for most of the tree, janet-lang/sqlite3 for
        # void/db-sqlite's suite and for the dry-run and contract gates,
        # which load the driver
        run: |
          for url in $(janet scripts/packages.janet dev-deps); do
            sudo jpm install "$url"
          done
          # libpq and libmysqlclient are both opened at runtime through
          # ffi/, so the client libraries are all void/db-postgres and
          # void/db-mysql need — no headers. libmariadb3 is MariaDB
          # Connector/C: it exports the same mysql_* API, and it is what
          # a Debian-family image actually has (ADR-0033)
          # librdkafka1 is void/kafka's, for the same reason (ADR-0035)
          sudo apt-get update && sudo apt-get install -y libpq5 libmariadb3 librdkafka1
          # void/redis needs no client library at all (a connection is a
          # net/ stream)

      - name: Start minio (void/storage-s3's server)
        # Not a service container: `minio server /data` is a *command*,
        # and a GitHub service cannot override one. It is here for the
        # half AWS's published vectors cannot check — that a signature
        # this code produces is one a real server accepts (ADR-0039).
        run: |
          docker run -d --name void-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=void -e MINIO_ROOT_PASSWORD=void-void-void \
            minio/minio:latest server /data
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set ci http://127.0.0.1:9000 void void-void-void &&
             mc mb --ignore-existing ci/void-test"

      - name: Build void/fdwait
        # the monorepo's one native module (ADR-0011). void/db-postgres
        # and void/kafka import it, so the dry-run and contract gates
        # need it built before they can load either plugin at all — and
        # so does void/jobs's SKIP LOCKED suite, which reaches Postgres
        # through the same driver.
        run: cd fdwait && jpm build

      - name: The package graph agrees with the tree on disk
        run: janet scripts/packages.janet check

      - name: Test every package
        # the steps are a projection of scripts/packages.janet, in
        # topological order, with the examples last — a package added to
        # the graph is tested here without touching this file (ADR-0020)
        run: |
          while IFS=$'\t' read -r name dir; do
            echo "::group::jpm test $name ($dir)"
            ( cd "$dir" && jpm test )
            echo "::endgroup::"
          done < <(janet scripts/packages.janet ci)

      - name: Dry-run the full plugin composition
        run: janet scripts/dry-run.janet

      - name: Contract docs match the declarations (frozen v1)
        run: |
          janet scripts/gen-contracts.janet
          git diff --exit-code docs/CONTRACTS.md

      - name: The docs site generates
        # site.yml builds and publishes only on push to main, so a PR
        # that breaks the generator (or ships an unparsed table — the
        # generator refuses those itself) would surface only after the
        # merge. This is the same generation, run as a gate.
        run: janet scripts/gen-site.janet

  # The user's path, which nothing above touches: `jpm test` runs against
  # the live sources in the checkout, so an installation that does not
  # work is invisible to it. Here the bundle is installed into a tree
  # with nothing else in it, and the README's Quick start is executed
  # rather than described (ADR-0020).
  install:
    name: Clean machine — install the bundle, scaffold and smoke a project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Janet
        run: |
          git clone --depth 1 --branch v1.41.2 https://github.com/janet-lang/janet /tmp/janet
          make -C /tmp/janet -j"$(nproc)"
          sudo make -C /tmp/janet install

      - name: Install jpm
        run: |
          git clone --depth 1 https://github.com/janet-lang/jpm /tmp/jpm
          cd /tmp/jpm && sudo janet bootstrap.janet

      - name: Install the void bundle into an isolated tree
        # one `jpm install` of the repository root — no per-package
        # steps, no module path wiring, nothing from the checkout on the
        # path afterwards
        run: |
          jpm --tree="$HOME/void-tree" deps
          jpm --tree="$HOME/void-tree" install
          echo "JANET_PATH=$HOME/void-tree/lib" >> "$GITHUB_ENV"
          echo "$HOME/void-tree/bin" >> "$GITHUB_PATH"

      - name: The driver library an application opts into
        # janet-lang/sqlite3 is deliberately not in the bundle
        # (ADR-0011, ADR-0020): void/db-sqlite is a plugin an
        # application lists, and a missing library is a readable error
        # at :start rather than a dependency everybody installs. So the
        # applications in this job install it, which is what an
        # application does — `void make auth` generates a suite that
        # boots the driver, and examples/hub keeps its data in it.
        run: |
          for url in $(janet scripts/packages.janet installed-deps); do
            jpm --tree="$HOME/void-tree" install "$url"
          done

      - name: The installed binary has exactly one shebang
        # jpm writes it (:is-janet true); cli/bin/void must not carry
        # one of its own
        run: |
          test "$(grep -c '^#!' "$HOME/void-tree/bin/void")" = 1

      - name: The whole framework is importable as void/...
        run: |
          janet -e '(import void/http) (import void/html) (import void/htmx)
                    (import void/rest) (import void/openapi) (import void/db)
                    (import void/db-sqlite) (import void/redis) (import void/cache)
                    (import void/jobs) (import void/pressure) (import void/obs)
                    (import void/crypto) (import void/auth) (import void/authz) (import void/security)
                    (import void/mail) (import void/bus) (import void/kafka)
                    (import void/ws) (import void/i18n) (import void/datastar)
                    (import void/tls)
                    (import void/dev)
                    (import void/fdwait)
                    (print "every package imports from the installed tree")'

      - name: void new, then smoke the generated project
        run: |
          cd "$(mktemp -d)"
          void version
          void new smoke
          cd smoke
          # the manifest is a dependency, not a comment
          grep -q 'https://github.com/bondiano/void.git' project.janet
          void routes | tee /tmp/routes.txt
          grep -q ':home' /tmp/routes.txt
          grep -q ':entries/create' /tmp/routes.txt

      - name: A project-local jpm_tree wins over the installed one
        # the launcher swaps syspath before importing the CLI, so both
        # halves of the process come from the same tree (ADR-0020)
        run: |
          cd "$(mktemp -d)"
          void new pinned
          cd pinned
          mkdir -p jpm_tree
          cp -r "$HOME/void-tree/lib" jpm_tree/lib
          void routes | grep -q ':entries/create'

      - name: void make resource, and the suite it generates
        # the four generated files are four projections of one
        # declaration (ROADMAP 4.5); the generated suite is what asserts
        # they still agree, and it needs no database to do it
        run: |
          cd "$(mktemp -d)"
          void new scaffold
          cd scaffold
          void make resource Product name:string price:int notes:text? < /dev/null
          test -f resources/products.janet
          test -f test/products-test.janet
          ls db/migrations/*_create_products.janet
          janet test/products-test.janet | grep -q 'products-test ok'

      - name: void make auth, and the suite it generates
        # the scaffold is checked by what it itself generates (ROADMAP
        # 6.2): the generated suite boots the generated plugin on sqlite
        # and drives register, verify, sign in, CSRF and the reset
        run: |
          cd "$(mktemp -d)"
          void new accounts
          cd accounts
          void make auth < /dev/null
          test -f auth.janet
          test -f test/auth-test.janet
          ls db/migrations/*_create_users.janet
          janet test/auth-test.janet | grep -q 'auth-test ok'

      - name: void plugins lock, and the drift it catches
        run: |
          cd "$(mktemp -d)"
          void new locked
          cd locked
          void plugins lock
          grep -q ':lock-version 1' void.lock
          void plugins check
          # a plugin added to the composition is a failed check, and the
          # report names the point whose chain moved
          sed -i 's/:void\/dev :locked\/app/:void\/dev :void\/pressure :locked\/app/' main.janet
          sed -i 's|(import void/dev)|(import void/dev)\n(import void/pressure)|' main.janet
          if void plugins check > /tmp/check.txt 2>&1; then
            echo "expected a drifted composition to fail the check"; cat /tmp/check.txt; exit 1
          fi
          grep -q ':void/pressure is new' /tmp/check.txt

      - name: jpm build, and the single binary that comes out
        # SPEC §9 and docs/DEPLOY.md: no janet, no jpm, no module tree on
        # the target, and the binary is also the CLI (cli/app-main)
        run: |
          cd "$(mktemp -d)"
          void new shipped
          cd shipped
          mkdir -p jpm_tree
          cp -r "$HOME/void-tree/lib" jpm_tree/lib
          jpm --local build
          ls -l build/shipped
          # run it from a directory with nothing else in it
          BIN="$(pwd)/build/shipped"
          cd "$(mktemp -d)"
          VOID_PROFILE=prod "$BIN" routes | grep -q ':entries/create'
          VOID_PROFILE=prod "$BIN" deploy check
          VOID_PROFILE=prod VOID_HTTP__PORT=8123 "$BIN" &
          server=$!
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8123/ > /tmp/page.html; then break; fi
            sleep 0.25
          done
          kill "$server"
          grep -q 'shipped guestbook' /tmp/page.html

      - name: The examples that run off the install rather than the checkout
        # Everything above this line is a scaffold: `void new` writes it,
        # a step smokes it, and it is thrown away. examples/hub is an
        # application that stays — and the one in the repository with no
        # test-support/paths.janet, so it imports void/... from the tree
        # installed at the top of this job and from nowhere else
        # (ROADMAP 6.6, scripts/install-tree.janet). The list is the
        # package graph's, like every other list here.
        run: |
          while IFS=$'\t' read -r name dir; do
            echo "::group::jpm test $name ($dir)"
            ( cd "$dir" && jpm --tree="$HOME/void-tree" test )
            echo "::endgroup::"
          done < <(janet scripts/packages.janet ci-installed)

  # void/crypto is ffi to a library the machine provides, so what it can
  # do is a property of the machine (ADR-0022): the argon2id KDF needs
  # OpenSSL 3.2, and the candidate list is platform-specific because on
  # macOS loading libcrypto by soname *aborts the process*. Neither fact
  # can be checked by reasoning, so both legs run the suite:
  #
  #   ubuntu-latest   OpenSSL 3.0  — argon2id absent, the skip path
  #   macos-latest    Homebrew 3.x — argon2id present, and the one
  #                                  platform where a wrong candidate
  #                                  list kills the process
  crypto:
    name: void/crypto on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install Janet
        run: |
          git clone --depth 1 --branch v1.41.2 https://github.com/janet-lang/janet /tmp/janet
          make -C /tmp/janet -j"$(getconf _NPROCESSORS_ONLN)"
          sudo make -C /tmp/janet install

      - name: Install jpm
        run: |
          git clone --depth 1 https://github.com/janet-lang/jpm /tmp/jpm
          cd /tmp/jpm && sudo janet bootstrap.janet

      - name: Install dependencies
        run: sudo jpm install https://github.com/janet-lang/spork.git

      - name: Which library, and what it provides
        # the suite asserts this too, but a failing run should say what
        # it was running against before it says what broke
        run: |
          cd crypto
          janet -e '(import ./test-support/paths) (import void/crypto :as c)
                    (c/load!) (printf "%s %s" (c/version-text) (string/format "%q" (c/algorithms)))'

      - name: Test void/crypto
        run: cd crypto && jpm test
