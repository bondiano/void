name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # void/db-postgres and void/redis are clients of a real server or
    # they are nothing, and void/cache's and void/jobs's redis backends
    # are too: their integration suites run when VOID_TEST_PG /
    # VOID_TEST_REDIS name a server, and skip (loudly) when they do not —
    # so CI is where they are a gate.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: void
          POSTGRES_PASSWORD: void
          POSTGRES_DB: void_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VOID_TEST_PG: host=127.0.0.1 port=5432 user=void password=void dbname=void_test
      # database 9, and every suite works under a prefix of its own
      VOID_TEST_REDIS: redis://127.0.0.1:6379/9

    steps:
      - uses: actions/checkout@v4

      - name: Install Janet
        run: |
          git clone --depth 1 --branch v1.41.2 https://github.com/janet-lang/janet /tmp/janet
          make -C /tmp/janet -j"$(nproc)"
          sudo make -C /tmp/janet install

      - name: Install jpm
        run: |
          git clone --depth 1 https://github.com/janet-lang/jpm /tmp/jpm
          cd /tmp/jpm && sudo janet bootstrap.janet

      - name: Install dependencies
        # the list is the package graph's, not this file's (ADR-0020):
        # spork for most of the tree, janet-lang/sqlite3 for
        # void/db-sqlite's suite and for the dry-run and contract gates,
        # which load the driver
        run: |
          for url in $(janet scripts/packages.janet dev-deps); do
            sudo jpm install "$url"
          done
          # libpq itself is opened at runtime through ffi/, so the
          # client library is all void/db-postgres needs — no headers
          sudo apt-get update && sudo apt-get install -y libpq5
          # void/redis needs no client library at all (a connection is a
          # net/ stream)

      - name: Build void/fdwait
        # the monorepo's one native module (ADR-0011). void/db-postgres
        # imports it, so the dry-run and contract gates need it built
        # before they can load the plugin at all — and so does
        # void/jobs's SKIP LOCKED suite, which reaches Postgres through
        # the same driver.
        run: cd fdwait && jpm build

      - name: The package graph agrees with the tree on disk
        run: janet scripts/packages.janet check

      - name: Test every package
        # the steps are a projection of scripts/packages.janet, in
        # topological order, with the examples last — a package added to
        # the graph is tested here without touching this file (ADR-0020)
        run: |
          while IFS=$'\t' read -r name dir; do
            echo "::group::jpm test $name ($dir)"
            ( cd "$dir" && jpm test )
            echo "::endgroup::"
          done < <(janet scripts/packages.janet ci)

      - name: Dry-run the full plugin composition
        run: janet scripts/dry-run.janet

      - name: Contract docs match the declarations (frozen v1)
        run: |
          janet scripts/gen-contracts.janet
          git diff --exit-code docs/CONTRACTS.md

  # The user's path, which nothing above touches: `jpm test` runs against
  # the live sources in the checkout, so an installation that does not
  # work is invisible to it. Here the bundle is installed into a tree
  # with nothing else in it, and the README's Quick start is executed
  # rather than described (ADR-0020).
  install:
    name: Clean machine — install the bundle, scaffold and smoke a project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Janet
        run: |
          git clone --depth 1 --branch v1.41.2 https://github.com/janet-lang/janet /tmp/janet
          make -C /tmp/janet -j"$(nproc)"
          sudo make -C /tmp/janet install

      - name: Install jpm
        run: |
          git clone --depth 1 https://github.com/janet-lang/jpm /tmp/jpm
          cd /tmp/jpm && sudo janet bootstrap.janet

      - name: Install the void bundle into an isolated tree
        # one `jpm install` of the repository root — no per-package
        # steps, no module path wiring, nothing from the checkout on the
        # path afterwards
        run: |
          jpm --tree="$HOME/void-tree" deps
          jpm --tree="$HOME/void-tree" install
          echo "JANET_PATH=$HOME/void-tree/lib" >> "$GITHUB_ENV"
          echo "$HOME/void-tree/bin" >> "$GITHUB_PATH"

      - name: The installed binary has exactly one shebang
        # jpm writes it (:is-janet true); cli/bin/void must not carry
        # one of its own
        run: |
          test "$(grep -c '^#!' "$HOME/void-tree/bin/void")" = 1

      - name: The whole framework is importable as void/...
        run: |
          janet -e '(import void/http) (import void/html) (import void/htmx)
                    (import void/rest) (import void/openapi) (import void/db)
                    (import void/db-sqlite) (import void/redis) (import void/cache)
                    (import void/jobs) (import void/pressure) (import void/obs)
                    (import void/crypto) (import void/auth) (import void/authz) (import void/security)
                    (import void/dev)
                    (import void/fdwait)
                    (print "every package imports from the installed tree")'

      - name: void new, then smoke the generated project
        run: |
          cd "$(mktemp -d)"
          void version
          void new smoke
          cd smoke
          # the manifest is a dependency, not a comment
          grep -q 'https://github.com/bondiano/void.git' project.janet
          void routes | tee /tmp/routes.txt
          grep -q ':home' /tmp/routes.txt
          grep -q ':entries/create' /tmp/routes.txt

      - name: A project-local jpm_tree wins over the installed one
        # the launcher swaps syspath before importing the CLI, so both
        # halves of the process come from the same tree (ADR-0020)
        run: |
          cd "$(mktemp -d)"
          void new pinned
          cd pinned
          mkdir -p jpm_tree
          cp -r "$HOME/void-tree/lib" jpm_tree/lib
          void routes | grep -q ':entries/create'

  # void/crypto is ffi to a library the machine provides, so what it can
  # do is a property of the machine (ADR-0022): the argon2id KDF needs
  # OpenSSL 3.2, and the candidate list is platform-specific because on
  # macOS loading libcrypto by soname *aborts the process*. Neither fact
  # can be checked by reasoning, so both legs run the suite:
  #
  #   ubuntu-latest   OpenSSL 3.0  — argon2id absent, the skip path
  #   macos-latest    Homebrew 3.x — argon2id present, and the one
  #                                  platform where a wrong candidate
  #                                  list kills the process
  crypto:
    name: void/crypto on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install Janet
        run: |
          git clone --depth 1 --branch v1.41.2 https://github.com/janet-lang/janet /tmp/janet
          make -C /tmp/janet -j"$(getconf _NPROCESSORS_ONLN)"
          sudo make -C /tmp/janet install

      - name: Install jpm
        run: |
          git clone --depth 1 https://github.com/janet-lang/jpm /tmp/jpm
          cd /tmp/jpm && sudo janet bootstrap.janet

      - name: Install dependencies
        run: sudo jpm install https://github.com/janet-lang/spork.git

      - name: Which library, and what it provides
        # the suite asserts this too, but a failing run should say what
        # it was running against before it says what broke
        run: |
          cd crypto
          janet -e '(import ./test-support/paths) (import void/crypto :as c)
                    (c/load!) (printf "%s %s" (c/version-text) (string/format "%q" (c/algorithms)))'

      - name: Test void/crypto
        run: cd crypto && jpm test
